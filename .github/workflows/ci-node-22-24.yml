name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Analyse
        run: npm run analyse

      - name: Build
        if: runner.os == 'Linux'
        run: npm run build --if-present

      - name: Test
        run: npm test -- --runInBand